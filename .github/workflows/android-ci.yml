name: Android CI

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make wrapper executable
        run: chmod +x ./gradlew
      - name: Build debug APK
        env:
          TAPSELL_APP_KEY: ${{ secrets.TAPSELL_APP_KEY }}
          BAZAAR_RSA_PUBLIC_KEY: ${{ secrets.BAZAAR_RSA_PUBLIC_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: ./gradlew --no-daemon assembleDebug
      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: YouTubeYar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
