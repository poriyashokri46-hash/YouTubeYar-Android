name: Build test APK for Cafe Bazaar

on:
  push:
    branches: ["hardening/production-readiness"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build installable debug APK for initial testing
        run: ./gradlew --no-daemon assembleDebug
      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug
      - name: Prepare test APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/YouTubeYar-2.0.0-test-debug.apk
          (cd dist && sha256sum YouTubeYar-2.0.0-test-debug.apk > SHA256SUMS.txt)
      - name: Upload test APK
        if: always() && hashFiles('dist/YouTubeYar-2.0.0-test-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeYar-2.0.0-test-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 14
