name: Build APK AAB BIN artifacts

on:
  push:
    branches: ["hardening/production-readiness"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build installable debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Build release APK and Android App Bundle
        run: ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Prepare requested .bin alias and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/YouTubeYar-2.0.0-debug.apk
          if compgen -G 'app/build/outputs/apk/release/*.apk' > /dev/null; then
            cp app/build/outputs/apk/release/*.apk dist/YouTubeYar-2.0.0-release.apk
            # .bin is a byte-for-byte APK alias for workflows that require a .bin extension;
            # it is not a separate Android package format.
            cp dist/YouTubeYar-2.0.0-release.apk dist/YouTubeYar-2.0.0-release.bin
          fi
          cp app/build/outputs/bundle/release/*.aab dist/YouTubeYar-2.0.0-release.aab
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeYar-2.0.0-build-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 14
